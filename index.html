    // ==========================================
    // 2. 상태 관리 및 LocalStorage 연동
    // ==========================================
    const STORAGE_KEY = "SAFETYB_APP_STATE_V1";
    let state = {
      currentTab: "home",
      selectedTrack: "ALL", // ALL, 산업안전기사, 건설안전기사, COMMON
      questions: [],
      concepts: [],
      history: {}, // { questionId: { attempts: 0, correct: 0, lastCorrect: true } }
      wrongNotes: {}, // { questionId: { count: 1, memo: "", date: "" } }
      bookmarks: [], // [questionId or conceptId]
      todaySolved: 0,
      todayDate: new Date().toISOString().slice(0, 10),
      // 개념 탭 상태
      conceptFilter: "ALL",
      conceptSearch: "",
      blindMode: false,
      // CBT 탭 상태
      cbtMode: "study", // study(한문제씩), exam(실전모의고사)
      cbtActive: false,
      cbtQueue: [],
      cbtIndex: 0,
      cbtAnswers: {}, // { index: selectedOption(1~4) }
      cbtSubmitted: false,
      cbtTimer: 0,
      cbtInterval: null
    };

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
          const today = new Date().toISOString().slice(0, 10);
          if (state.todayDate !== today) {
            state.todayDate = today;
            state.todaySolved = 0;
          }
        } catch (e) {
          console.error(e);
        }
      }
      if (!state.questions || state.questions.length === 0) state.questions = DEFAULT_QUESTIONS;
      if (!state.concepts || state.concepts.length === 0) state.concepts = DEFAULT_CONCEPTS;
      saveState();
    }

    function saveState() {
      const toSave = {
        selectedTrack: state.selectedTrack,
        questions: state.questions,
        concepts: state.concepts,
        history: state.history,
        wrongNotes: state.wrongNotes,
        bookmarks: state.bookmarks,
        todaySolved: state.todaySolved,
        todayDate: state.todayDate,
        blindMode: state.blindMode
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      updateHeaderAndNav();
    }

    // 트랙 필터링 헬퍼
    function getFilteredQuestions() {
      return state.questions.filter(q => {
        if (state.selectedTrack === "ALL") return true;
        if (state.selectedTrack === "COMMON") {
          return q.cert_type.includes("산업안전기사") && q.cert_type.includes("건설안전기사");
        }
        return q.cert_type.includes(state.selectedTrack);
      });
    }

    function getFilteredConcepts() {
      return state.concepts.filter(c => {
        if (state.selectedTrack === "ALL") return true;
        if (state.selectedTrack === "COMMON") {
          return c.cert_type.includes("산업안전기사") && c.cert_type.includes("건설안전기사");
        }
        return c.cert_type.includes(state.selectedTrack);
      });
    }

    function setTrack(track) {
      state.selectedTrack = track;
      state.cbtActive = false;
      saveState();
      render();
    }

    function switchTab(tab) {
      state.currentTab = tab;
      if (tab !== "cbt" && state.cbtInterval) {
        clearInterval(state.cbtInterval);
      }
      updateHeaderAndNav();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateHeaderAndNav() {
      const fq = getFilteredQuestions();
      const fc = getFilteredConcepts();
      document.getElementById("header-stats").textContent = `${fq.length}문항 · ${fc.length}개념`;

      document.querySelectorAll(".track-btn").forEach(btn => {
        if (btn.dataset.track === state.selectedTrack) {
          btn.className = "track-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-extrabold bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20 transition";
        } else {
          btn.className = "track-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-800/90 text-slate-300 border border-slate-700/80 hover:bg-slate-700 transition";
        }
      });

      ["home", "concept", "cbt", "wrong"].forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (t === state.currentTab) {
          el.className = "flex flex-col items-center gap-1 text-amber-400 relative";
        } else {
          el.className = "flex flex-col items-center gap-1 text-slate-400 relative";
        }
      });

      const wrongCount = Object.keys(state.wrongNotes).length;
      const badge = document.getElementById("wrong-badge");
      if (wrongCount > 0) {
        badge.textContent = wrongCount;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    // ==========================================
    // 3. 화면 렌더링 함수 (홈 / 개념 / CBT / 오답노트)
    // ==========================================
    function render() {
      const container = document.getElementById("main-content");
      if (state.currentTab === "home") renderHome(container);
      else if (state.currentTab === "concept") renderConcept(container);
      else if (state.currentTab === "cbt") renderCBT(container);
      else if (state.currentTab === "wrong") renderWrong(container);
    }

    // [탭 1] 홈 대시보드
    function renderHome(container) {
      const fq = getFilteredQuestions();
      let totalAttempts = 0;
      let totalCorrect = 0;
      let coveredCount = 0;

      const subjectStats = {};
      fq.forEach(q => {
        if (!subjectStats[q.subject]) subjectStats[q.subject] = { total: 0, solved: 0, correct: 0 };
        subjectStats[q.subject].total++;
        const h = state.history[q.id];
        if (h && h.attempts > 0) {
          coveredCount++;
          totalAttempts += h.attempts;
          totalCorrect += h.correct;
          subjectStats[q.subject].solved++;
          if (h.lastCorrect) subjectStats[q.subject].correct++;
        }
      });

      const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
      const coveragePct = fq.length > 0 ? Math.round((coveredCount / fq.length) * 100) : 0;
      const wrongCount = Object.keys(state.wrongNotes).length;

      const trackLabel = state.selectedTrack === "ALL" ? "전체(쌍기사)" : state.selectedTrack === "COMMON" ? "공통과목 집중" : state.selectedTrack;

            </div>
            <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden">
              <div class="h-full bg-amber-500 transition-all duration-300" style="width: ${coveragePct}%"></div>

          </div>

          <div class="grid grid-cols-3 gap-2.5">

              <p class="text-2xl font-black text-rose-400">${wrongCount}<span class="text-xs font-normal text-slate-400 ml-0.5">개</span></p>

                    <p class="text-sm font-bold text-white">틀린 문제 복습하기</p>
                    <p class="text-xs text-slate-400">${wrongCount > 0 ? `현재 오답노트에 ${wrongCount}문제가 대기 중입니다` : "아직 오답이 없어요"}</p>

    // [탭 2] 개념 학습 (Concept Wiki)
    function formatConceptSummary(text, blind) {
      if (!blind) {
        return text.replace(/\[\[(.*?)\]\]/g, '<span class="text-amber-400 font-bold underline decoration-amber-500/50 underline-offset-4">$1</span>');
      }
      return text.replace(/\[\[(.*?)\]\]/g, '<span onclick="this.classList.toggle(\'revealed\')" class="blank-mask" title="터치하여 정답 확인">$1</span>');
    }

    function renderConcept(container) {
      const fc = getFilteredConcepts();
      const subjects = ["ALL", ...new Set(fc.map(c => c.subject))];

      const filtered = fc.filter(c => {
        const matchSubj = state.conceptFilter === "ALL" || c.subject === state.conceptFilter;
        const matchSearch = !state.conceptSearch || c.title.includes(state.conceptSearch) || c.summary.includes(state.conceptSearch);
        return matchSubj && matchSearch;
      });

      container.innerHTML = `
        <div class="space-y-3.5">
          <!-- 상단 검색 및 수치 가리기 스위치 -->
          <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-3.5 space-y-2.5">

              </div>
              <button onclick="toggleBlindMode()" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.blindMode ? 'bg-amber-500 text-slate-950 border-amber-400' : 'bg-slate-900 text-slate-300 border-slate-700'}">
                ${state.blindMode ? '🙈 수치 가리기 ON' : '👀 수치 보이기'}
              </button>
            </div>
            <input
              type="text"
              placeholder="개념 키워드 검색 (예: 비계, 하인리히, 산소, 신뢰도...)"
              value="${state.conceptSearch}"
              oninput="state.conceptSearch = this.value; render();"
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
            />
          </div>

          <!-- 과목 필터 -->
          <div class="flex gap-1.5 overflow-x-auto hide-scrollbar pb-1">
            ${subjects.map(s => `
              <button onclick="state.conceptFilter='${s}'; render();" class="shrink-0 px-3 py-1 rounded-lg text-xs font-semibold ${state.conceptFilter === s ? 'bg-slate-200 text-slate-900' : 'bg-slate-800 text-slate-400'}">
                ${s === 'ALL' ? '전체 과목' : s}
              </button>
            `).join("")}
          </div>

          <!-- 개념 카드 리스트 -->
          <div class="space-y-3">
            ${filtered.map(c => {
              const isBookmarked = state.bookmarks.includes(c.id);
              const linkedQs = state.questions.filter(q => q.concept_id === c.id);
              return `
                <div class="bg-slate-800/70 border border-slate-700/80 rounded-2xl p-4 space-y-2.5">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/15 text-amber-400 border border-amber-500/30 mb-1">${c.subject}</span>
                      <h3 class="text-sm font-extrabold text-white leading-snug">${c.title}</h3>
                    </div>
                    <button onclick="toggleBookmark('${c.id}')" class="text-lg ${isBookmarked ? 'text-amber-400' : 'text-slate-600'}">★</button>
                  </div>
                  <p class="text-xs text-slate-200 leading-relaxed bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                    ${formatConceptSummary(c.summary, state.blindMode)}
                  </p>
                  <div class="flex items-center justify-between pt-1">
                    <span class="text-[11px] text-slate-400">📌 근거: ${c.law}</span>
                    ${linkedQs.length > 0 ? `
                      <button onclick="startConceptQuestions('${c.id}')" class="text-xs font-bold text-amber-400 hover:underline">
                        연결 기출 풀기 (${linkedQs.length}문항) →
                      </button>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function toggleBlindMode() {
      state.blindMode = !state.blindMode;
      saveState();
      render();
    }

    function goBlindConcept() {
      state.blindMode = true;
      saveState();
      switchTab("concept");
    }

    function toggleBookmark(id) {
      const idx = state.bookmarks.indexOf(id);
      if (idx >= 0) state.bookmarks.splice(idx, 1);
      else state.bookmarks.push(id);
      saveState();
      render();
    }

    // [탭 3] CBT 문제풀이
    function startCBT(mode, count) {
      const pool = [...getFilteredQuestions()];
      if (pool.length === 0) {
        alert("선택한 트랙에 등록된 문제가 없습니다.");
        return;
      }
      pool.sort(() => Math.random() - 0.5);
      state.cbtMode = mode;
      state.cbtQueue = count ? pool.slice(0, count) : pool;
      state.cbtIndex = 0;
      state.cbtAnswers = {};
      state.cbtSubmitted = false;
      state.cbtActive = true;

      if (state.cbtInterval) clearInterval(state.cbtInterval);
      if (mode === "exam") {
        state.cbtTimer = state.cbtQueue.length * 90; // 문항당 1분 30초
        state.cbtInterval = setInterval(() => {
          if (state.cbtTimer > 0 && !state.cbtSubmitted) {
            state.cbtTimer--;
            const timerEl = document.getElementById("exam-timer");
            if (timerEl) {
              const m = String(Math.floor(state.cbtTimer / 60)).padStart(2, "0");
              const s = String(state.cbtTimer % 60).padStart(2, "0");
              timerEl.textContent = `⏱️ ${m}:${s}`;
            }
          }
        }, 1000);
      }

      switchTab("cbt");
    }

    function startConceptQuestions(conceptId) {
      const pool = state.questions.filter(q => q.concept_id === conceptId);
      if (pool.length === 0) return;
      state.cbtMode = "study";
      state.cbtQueue = pool;
      state.cbtIndex = 0;
      state.cbtAnswers = {};
      state.cbtSubmitted = false;
      state.cbtActive = true;
      switchTab("cbt");
    }

    function startQuickWrong() {
      const wrongIds = Object.keys(state.wrongNotes);
      const pool = state.questions.filter(q => wrongIds.includes(q.id));
      if (pool.length === 0) {
        alert("현재 오답노트에 등록된 문제가 없습니다! CBT 문제풀이를 먼저 진행해 보세요.");
        return;
      }
      state.cbtMode = "study";
      state.cbtQueue = pool;
      state.cbtIndex = 0;
      state.cbtAnswers = {};
      state.cbtSubmitted = false;
      state.cbtActive = true;
      switchTab("cbt");
    }

    function selectOption(optionNumber) {
      if (state.cbtMode === "exam" && state.cbtSubmitted) return;
      const q = state.cbtQueue[state.cbtIndex];
      const alreadyAnswered = state.cbtAnswers[state.cbtIndex] !== undefined;
      state.cbtAnswers[state.cbtIndex] = optionNumber;

      if (state.cbtMode === "study" && !alreadyAnswered) {
        recordQuestionResult(q, optionNumber === q.answer);
      }
      render();
    }

    function recordQuestionResult(q, isCorrect) {
      if (!state.history[q.id]) {
        state.history[q.id] = { attempts: 0, correct: 0, lastCorrect: false };
      }
      state.history[q.id].attempts++;
      if (isCorrect) state.history[q.id].correct++;
      state.history[q.id].lastCorrect = isCorrect;
      state.todaySolved++;

      if (!isCorrect) {
        if (!state.wrongNotes[q.id]) {
          state.wrongNotes[q.id] = { count: 1, memo: "", date: new Date().toISOString().slice(0, 10) };
        } else {
          state.wrongNotes[q.id].count++;
        }
      }
      saveState();
    }

    function submitExam() {
      if (state.cbtSubmitted) return;
      state.cbtSubmitted = true;
      if (state.cbtInterval) clearInterval(state.cbtInterval);

      // 실제로 답을 선택한 문항만 오답노트/기록에 반영
      state.cbtQueue.forEach((q, idx) => {
        const picked = state.cbtAnswers[idx];
        if (picked !== undefined) {
          recordQuestionResult(q, picked === q.answer);
        }
      });
      render();
    }

    function renderCBT(container) {
      const fq = getFilteredQuestions();

      // 모드 선택 대기 화면
      if (!state.cbtActive) {
        container.innerHTML = `
          <div class="space-y-4">
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4">
              <h2 class="text-base font-extrabold text-white mb-1">CBT 문제풀이 모드 선택</h2>
              <p class="text-xs text-slate-400">현재 선택된 트랙 문항 수: 총 ${fq.length}문항</p>
            </div>

            <div class="space-y-3">
              <div class="bg-slate-800/70 border border-amber-500/40 rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-amber-500 text-slate-950">추천 학습</span>
                  <span class="text-xs text-slate-400">즉시 채점 + 개념 카드 연동</span>
                </div>
                <h3 class="text-base font-extrabold text-white">📘 한 문제씩 학습 모드</h3>
                <p class="text-xs text-slate-300 leading-relaxed">보기를 누르는 즉시 정답 여부와 상세 해설이 펼쳐지며, 문제와 연결된 핵심 개념 카드를 그 자리에서 바로 복습합니다.</p>
                <div class="grid grid-cols-2 gap-2 pt-1">
                  <button onclick="startCBT('study', 10)" class="py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs transition">10문제 빠른 학습</button>
                  <button onclick="startCBT('study', null)" class="py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs transition">전 문항(${fq.length}제) 학습</button>
                </div>
              </div>

              <div class="bg-slate-800/70 border border-slate-700 rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">실전 대비</span>
                  <span class="text-xs text-slate-400">타이머 + 과락/합격 판정</span>
                </div>
                <h3 class="text-base font-extrabold text-white">⏱️ 실전 모의고사 모드</h3>
                <p class="text-xs text-slate-300 leading-relaxed">실제 큐넷 CBT 시험장처럼 타이머가 작동하며, 모든 문제를 풀고 제출하면 평균 60점 및 과목별 40점 과락 여부를 자동 판정합니다.</p>
                <button onclick="startCBT('exam', null)" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs transition">실전 모의고사 시작하기</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // 모의고사 제출 후 성적표 화면
      if (state.cbtMode === "exam" && state.cbtSubmitted) {
        let correctCount = 0;
        const subjScores = {};
        state.cbtQueue.forEach((q, idx) => {
          if (!subjScores[q.subject]) subjScores[q.subject] = { total: 0, correct: 0 };
          subjScores[q.subject].total++;
          if (state.cbtAnswers[idx] === q.answer) {
            correctCount++;
            subjScores[q.subject].correct++;
          }
        });

        const totalScore = Math.round((correctCount / state.cbtQueue.length) * 100);
        let hasFailSubject = false;
        Object.values(subjScores).forEach(s => {
          const sc = Math.round((s.correct / s.total) * 100);
          if (sc < 40) hasFailSubject = true;
        });
        const isPass = totalScore >= 60 && !hasFailSubject;

        container.innerHTML = `
          <div class="space-y-4">
            <div class="bg-slate-800 border ${isPass ? 'border-emerald-500' : 'border-rose-500'} rounded-2xl p-5 text-center space-y-2">
              <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold ${isPass ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500 text-white'}">
                ${isPass ? '🎉 합격 (PASS)' : '⚠️ 불합격 (과락 또는 60점 미만)'}
              </span>
              <h2 class="text-3xl font-black text-white">${totalScore}점</h2>
              <p class="text-xs text-slate-400">총 ${state.cbtQueue.length}문제 중 ${correctCount}문제 정답</p>
            </div>

            <div class="bg-slate-800/70 border border-slate-700 rounded-2xl p-4 space-y-2.5">
              <h3 class="text-xs font-bold text-slate-300">과목별 성적 및 과락 여부 (40점 미만 과락)</h3>
              ${Object.entries(subjScores).map(([subj, s]) => {
                const sc = Math.round((s.correct / s.total) * 100);
                return `
                  <div class="flex justify-between items-center text-xs py-1 border-b border-slate-700/50">
                    <span class="text-slate-200">${subj}</span>
                    <span class="font-bold ${sc < 40 ? 'text-rose-400' : 'text-emerald-400'}">${sc}점 (${s.correct}/${s.total}) ${sc < 40 ? '[과락]' : ''}</span>
                  </div>
                `;
              }).join("")}
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button onclick="state.cbtMode='study'; state.cbtIndex=0; render();" class="py-3 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-xs">해설 및 오답 확인하기</button>
              <button onclick="state.cbtActive=false; render();" class="py-3 rounded-xl bg-slate-700 text-white font-bold text-xs">모드 선택으로 돌아가기</button>
            </div>
          </div>
        `;
        return;
      }

      // 문제 풀이 진행 화면
      const q = state.cbtQueue[state.cbtIndex];
      const picked = state.cbtAnswers[state.cbtIndex];
      const showFeedback = state.cbtMode === "study" && picked !== undefined;
      const linkedConcept = state.concepts.find(c => c.id === q.concept_id);
      const isBookmarked = state.bookmarks.includes(q.id);
      const inWrongNote = !!state.wrongNotes[q.id];

      const m = String(Math.floor(state.cbtTimer / 60)).padStart(2, "0");
      const s = String(state.cbtTimer % 60).padStart(2, "0");

      container.innerHTML = `
        <div class="space-y-3.5">
          <!-- 상단 상태 바 -->
          <div class="flex items-center justify-between bg-slate-800/90 border border-slate-700 rounded-xl px-3.5 py-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-extrabold text-amber-400">문항 ${state.cbtIndex + 1} / ${state.cbtQueue.length}</span>
              <span class="text-[11px] text-slate-400">· ${q.subject}</span>
            </div>
            <div class="flex items-center gap-2">
              ${state.cbtMode === "exam" ? `<span id="exam-timer" class="text-xs font-bold text-emerald-400">⏱️ ${m}:${s}</span>` : ""}
              <button onclick="state.cbtActive=false; render();" class="text-xs text-slate-400 hover:text-white">종료 ✕</button>
            </div>
          </div>

          <!-- 문제 본문 카드 -->
          <div class="bg-slate-800/70 border border-slate-700/90 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex gap-1">
                ${q.cert_type.map(ct => `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-700 text-slate-200">${ct}</span>`).join("")}
              </div>
              <div class="flex items-center gap-2">
                <button onclick="manualAddWrong('${q.id}')" class="text-xs px-2.5 py-1 rounded-lg border whitespace-nowrap ${inWrongNote ? 'bg-rose-500/20 border-rose-500/40 text-rose-300' : 'bg-slate-900 border-slate-700 text-slate-400'}">
                  ${inWrongNote ? '오답노트 등록됨' : '+ 오답 등록'}
                </button>
                <button onclick="toggleBookmark('${q.id}')" class="text-lg ${isBookmarked ? 'text-amber-400' : 'text-slate-500'}">★</button>
              </div>
            </div>

            <h3 class="text-sm font-bold text-white leading-relaxed">${q.question}</h3>

            <!-- 4지선다 버튼 -->
            <div class="space-y-2 pt-1">
              ${q.options.map((opt, idx) => {
                const optNum = idx + 1;
                let btnStyle = "bg-slate-900/90 border-slate-700 text-slate-200 hover:border-slate-500";
                if (showFeedback) {
                  if (optNum === q.answer) {
                    btnStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-200 font-bold";
                  } else if (optNum === picked && picked !== q.answer) {
                    btnStyle = "bg-rose-500/20 border-rose-500 text-rose-200 font-bold";
                  }
                } else if (picked === optNum) {
                  btnStyle = "bg-amber-500/20 border-amber-500 text-amber-200 font-bold";
                }
                return `
                  <button onclick="selectOption(${optNum})" class="w-full min-h-[52px] p-3.5 rounded-xl border text-left text-xs leading-snug transition flex items-center justify-between gap-2 ${btnStyle}">
                    <span>${opt}</span>
                    ${showFeedback && optNum === q.answer ? '<span class="shrink-0 text-emerald-400 font-extrabold">정답 ✓</span>' : ''}
                    ${showFeedback && optNum === picked && picked !== q.answer ? '<span class="shrink-0 text-rose-400 font-extrabold">오답 ✕</span>' : ''}
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <!-- 즉시 해설 및 연결된 핵심 개념 카드 (학습 모드) -->
          ${showFeedback ? `
            <div class="bg-slate-800/90 border ${picked === q.answer ? 'border-emerald-500/50' : 'border-rose-500/50'} rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold ${picked === q.answer ? 'text-emerald-400' : 'text-rose-400'}">
                  ${picked === q.answer ? '🎯 정답입니다!' : `💡 아쉽네요! 정답은 ${q.answer}번입니다. (오답노트 자동 저장)`}
                </span>
              </div>
              <p class="text-xs text-slate-200 leading-relaxed">${q.explanation}</p>
              <p class="text-[11px] text-slate-400">📌 관련 근거: ${q.law_reference}</p>

              ${linkedConcept ? `
                <div class="bg-slate-900 border border-amber-500/30 rounded-xl p-3 space-y-1.5">
                  <p class="text-[11px] font-bold text-amber-400">🔗 연결된 핵심 개념 카드: ${linkedConcept.title}</p>
                  <p class="text-xs text-slate-300 leading-relaxed">${formatConceptSummary(linkedConcept.summary, false)}</p>
                </div>
              ` : ''}
            </div>
          ` : ''}

          <!-- 이전 / 다음 / 제출 네비게이션 -->
          <div class="flex gap-2">
            <button
              onclick="if(state.cbtIndex > 0) { state.cbtIndex--; render(); }"
              ${state.cbtIndex === 0 ? 'disabled' : ''}
              class="flex-1 py-3 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300 disabled:opacity-40"
            >← 이전 문제</button>

            ${state.cbtIndex < state.cbtQueue.length - 1 ? `
              <button
                onclick="state.cbtIndex++; render();"
                class="flex-1 py-3 rounded-xl bg-amber-500 text-slate-950 text-xs font-extrabold"
              >다음 문제 →</button>
            ` : state.cbtMode === "exam" ? `
              <button
                onclick="submitExam()"
                class="flex-1 py-3 rounded-xl bg-emerald-500 text-slate-950 text-xs font-extrabold"
              >시험 제출 & 채점하기</button>
            ` : `
              <button
                onclick="state.cbtActive=false; render();"
                class="flex-1 py-3 rounded-xl bg-emerald-500 text-slate-950 text-xs font-extrabold"
              >학습 완료 ✓</button>
            `}
          </div>
        </div>
      `;
    }

    function manualAddWrong(qId) {
      if (!state.wrongNotes[qId]) {
        state.wrongNotes[qId] = { count: 1, memo: "", date: new Date().toISOString().slice(0, 10) };
      } else {
        delete state.wrongNotes[qId];
      }
      saveState();
      render();
    }

    // [탭 4] 스마트 오답노트 & 데이터 관리
    function renderWrong(container) {
      const wrongEntries = Object.entries(state.wrongNotes)
        .map(([id, info]) => {
          const q = state.questions.find(item => item.id === id);
          return q ? { ...q, wrongInfo: info } : null;
        })
        .filter(Boolean)
        .sort((a, b) => b.wrongInfo.count - a.wrongInfo.count);

      container.innerHTML = `
        <div class="space-y-4">
          <!-- 상단 오답노트 컨트롤 및 데이터 추가 버튼 -->
          <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-base font-extrabold text-white">스마트 오답노트</h2>
                <p class="text-xs text-slate-400">틀린 문제 자동 누적 및 나만의 암기 팁 기록</p>
              </div>
              <button onclick="toggleDataModal()" class="px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-extrabold">
                + 문제/개념 추가
              </button>
            </div>
            ${wrongEntries.length > 0 ? `
              <button onclick="startQuickWrong()" class="w-full py-2.5 rounded-xl bg-rose-500 hover:bg-rose-400 text-white font-extrabold text-xs transition">
                🔥 오답노트 ${wrongEntries.length}문제 전체 다시 풀기
              </button>
            ` : ''}
          </div>

          <!-- 데이터 추가/백업 모달 영역 (기본 숨김) -->
          <div id="data-modal" class="hidden bg-slate-900 border border-amber-500/50 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold text-amber-400">JSON 문제/개념 데이터 추가 및 백업</h3>
              <button onclick="toggleDataModal()" class="text-xs text-slate-400">닫기 ✕</button>
            </div>
            <p class="text-[11px] text-slate-300 leading-relaxed">
              새로운 기출문제나 개념 JSON 데이터를 아래 칸에 붙여넣고 [추가하기]를 누르면 내 사이트에 즉시 반영됩니다.
            </p>
            <div class="flex gap-1.5">
              <button onclick="fillSampleJSON()" class="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-[11px] text-amber-400 font-semibold">샘플 양식 불러오기</button>
              <button onclick="exportAllData()" class="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-[11px] text-emerald-400 font-semibold">전체 데이터 백업(복사)</button>
            </div>
            <textarea id="json-input" rows="6" placeholder='{"questions": [...], "concepts": [...]}' class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 font-mono"></textarea>
            <button onclick="importJSONData()" class="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-xs">앱에 즉시 추가/적용하기</button>
          </div>

          <!-- 오답 리스트 -->
          ${wrongEntries.length === 0 ? `
            <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-8 text-center space-y-2">
              <p class="text-2xl">✨</p>
              <p class="text-sm font-bold text-slate-300">현재 오답노트가 비어 있습니다</p>
              <p class="text-xs text-slate-500">CBT 풀이에서 틀린 문제가 생기면 이곳에 자동으로 정리됩니다.</p>
            </div>
          ` : `
            <div class="space-y-3">
              ${wrongEntries.map(item => `
                <div class="bg-slate-800/70 border border-slate-700 rounded-2xl p-4 space-y-2.5">
                  <div class="flex items-center justify-between">
                    <span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30">
                      ${item.wrongInfo.count}회 오답 · ${item.subject}
                    </span>
                    <button onclick="graduateWrong('${item.id}')" class="text-xs font-bold text-emerald-400 hover:underline">
                      ✓ 이해 완료 (오답 탈출)
                    </button>
                  </div>
                  <p class="text-xs font-bold text-white leading-relaxed">${item.question}</p>
                  <div class="bg-slate-900/90 rounded-xl p-2.5 text-xs text-emerald-300">
                    <strong>정답:</strong> ${item.options[item.answer - 1]}
                    <p class="text-slate-400 mt-1 text-[11px]">${item.explanation}</p>
                  </div>
                  <div class="flex gap-1.5 pt-1">
                    <input
                      type="text"
                      id="memo-${item.id}"
                      value="${item.wrongInfo.memo || ''}"
                      placeholder="나만의 한 줄 암기 팁 메모..."
                      class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white"
                    />
                    <button onclick="saveMemo('${item.id}')" class="px-3 py-1.5 rounded-xl bg-slate-700 text-xs font-bold text-amber-400">저장</button>
                  </div>
                </div>
              `).join("")}
            </div>
          `}
        </div>
      `;
    }

    function graduateWrong(id) {
      delete state.wrongNotes[id];
      saveState();
      render();
    }

    function saveMemo(id) {
      const val = document.getElementById(`memo-${id}`).value;
      if (state.wrongNotes[id]) {
        state.wrongNotes[id].memo = val;
        saveState();
        alert("암기 팁 메모가 저장되었습니다.");
      }
    }

    function toggleDataModal() {
      const modal = document.getElementById("data-modal");
      if (modal) modal.classList.toggle("hidden");
    }

    function fillSampleJSON() {
      const sample = {
        concepts: [
          {
            id: "C-CUSTOM-01",
            cert_type: ["산업안전기사", "건설안전기사"],
            subject: "건설안전기술",
            title: "안전대 및 추락방지망 설치 기준",
            summary: "추락방지망의 내민 길이는 벽면으로부터 [[3m]] 이상, 그물코 크기는 [[10cm]] 이하.",
            law: "산업안전보건기준에 관한 규칙 제42조"
          }
        ],
        questions: [
          {
            id: "Q-CUSTOM-01",
            cert_type: ["산업안전기사", "건설안전기사"],
            subject: "건설안전기술",
            concept_id: "C-CUSTOM-01",
            question: "추락방지망 설치 시 벽면으로부터 망의 내민 길이 기준은?",
            options: ["1. 1.5m 이상", "2. 2.0m 이상", "3. 3.0m 이상", "4. 4.0m 이상"],
            answer: 3,
            explanation: "추락방지망의 내민 길이는 벽면으로부터 3m 이상이어야 합니다.",
            law_reference: "산업안전보건기준에 관한 규칙 제42조"
          }
        ]
      };
      document.getElementById("json-input").value = JSON.stringify(sample, null, 2);
    }

    function exportAllData() {
      const dataStr = JSON.stringify({ questions: state.questions, concepts: state.concepts, wrongNotes: state.wrongNotes }, null, 2);
      document.getElementById("json-input").value = dataStr;
      navigator.clipboard?.writeText(dataStr);
      alert("전체 문제·개념·오답 데이터가 아래 입력창에 표시되고 클립보드에 복사되었습니다!");
    }

    function importJSONData() {
      const raw = document.getElementById("json-input").value.trim();
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        let qAdded = 0, cAdded = 0;
        if (Array.isArray(parsed.concepts)) {
          parsed.concepts.forEach(c => {
            const idx = state.concepts.findIndex(item => item.id === c.id);
            if (idx >= 0) state.concepts[idx] = c;
            else { state.concepts.push(c); cAdded++; }
          });
        }
        if (Array.isArray(parsed.questions)) {
          parsed.questions.forEach(q => {
            const idx = state.questions.findIndex(item => item.id === q.id);
            if (idx >= 0) state.questions[idx] = q;
            else { state.questions.push(q); qAdded++; }
          });
        }
        saveState();
        render();
        alert(`성공적으로 반영되었습니다! (신규 문제 ${qAdded}개, 신규 개념 ${cAdded}개 추가)`);
      } catch (e) {
        alert("JSON 형식이 올바르지 않습니다. 샘플 양식을 확인해 주세요.");
      }
    }

    // 앱 초기화 실행
    loadState();
    render();
  </script>
</body>
</html>
